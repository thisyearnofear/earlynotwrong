version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "thisyearnofear"

  - package-ecosystem: "npm"
    directory: "/agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "thisyearnofear"

  - package-ecosystem: "cargo"
    directory: "/casper"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "thisyearnofear"
