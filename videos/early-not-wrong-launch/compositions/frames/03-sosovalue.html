        // Eyebrow types in via discrete slice
        const eyebrowFull = "SoSoValue → Trade Decisions";
        const eyebrowEl = document.getElementById("head-eyebrow");
        const eyebrowLen = { v: 0 };
        eyebrowEl.textContent = "";
        eyebrowEl.style.opacity = 1;
        tl.to(
          eyebrowLen,
          {
            v: eyebrowFull.length,
            duration: 1.2,
            ease: "none",
            onUpdate: () => {
              eyebrowEl.textContent = eyebrowFull.substring(0, Math.floor(eyebrowLen.v));
            },
          },
          0.15,
        );

        // Title types in (white display)
        const titleFull = "Three signals.\nOne cycle.";
        const titleEl = document.getElementById("head-title-text");
        const titleLen = { v: 0 };
        tl.to(
          titleLen,
          {
            v: titleFull.length,
            duration: 1.0,
            ease: "none",
            onUpdate: () => {
              titleEl.innerHTML = titleFull
                .substring(0, Math.floor(titleLen.v))
                .replace(/\n/g, "<br>");
            },
          },
          0.55,
        );

        // Caret blink across the entire scene
        const caretEl = document.getElementById("head-caret");
        const caretPhase = { p: 0 };
        tl.fromTo(caretEl, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0.4);
        tl.to(
          caretPhase,
          {
            p: Math.PI * 2 * 18,
            duration: 22.0,
            ease: "none",
            onUpdate: () => {
              caretEl.style.opacity = Math.sin(caretPhase.p) > 0 ? "1" : "0.15";
            },
          },
          0.6,
        );

        // Cyan rule draws in below the title
        tl.fromTo("#head-rule", { width: 0 }, { width: 160, duration: 0.7, ease: "power3.out" }, 1.6);

        // Sub line fades in
        tl.fromTo("#head-sub", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.9);

        // Dashboard ghost fades in to its 0.22 hold (25% from brief, slightly tamed by vignette)
        tl.fromTo("#dash-ghost", { opacity: 0 }, { opacity: 0.22, duration: 1.6, ease: "power2.out" }, 0.4);

        // Ghost slots brighten up to dashed cyan placeholders
        tl.fromTo(
          [".ghost-slot.g1", ".ghost-slot.g2", ".ghost-slot.g3"],
          { opacity: 0 },
          { opacity: 1, duration: 0.5, ease: "power2.out", stagger: 0.12 },
          1.1,
        );

        // Scene counter fades in at the bottom-left
        tl.fromTo("#scene-counter", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.4);

        // ───────────── Phase 2: CARD 1 — SSI INDEX CONFIRMATION (2.5 – 9.0s) ─────────────

        // Card 1 slides from right and settles
        tl.fromTo(
          "#card1",
          { opacity: 0, x: 80, scale: 0.985 },
          { opacity: 1, x: 0, scale: 1, duration: 0.7, ease: "power3.out" },
          2.6,
        );
        // Bloom blooms in behind card 1
        tl.fromTo(
          "#bloom1",
          { opacity: 0, scale: 0.92 },
          { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" },
          2.8,
        );
        // Fade the ghost-slot #1 down as the real card lands
        tl.to("#ghost1", { opacity: 0, duration: 0.4, ease: "power2.out" }, 2.9);

        // Tickers stagger in (one per ssiX, paced ~0.18s)
        const tickers = document.querySelectorAll("#ssi-tickers .ticker");
        tickers.forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0, y: 6 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
            3.3 + i * 0.18,
          );
        });

        // Sparkline draws in, ROI figure + label fade in alongside
        tl.fromTo(
          "#spark-path",
          { strokeDashoffset: 200 },
          { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" },
          5.0,
        );
        tl.fromTo(
          "#ssi-meta .roi-figure",
          { opacity: 0 },
          { opacity: 1, duration: 0.5, ease: "power2.out" },
          5.4,
        );
        tl.fromTo(
          "#ssi-meta .ssi-label",
          { opacity: 0, y: 6 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
          5.7,
        );

        // Bounded ambient breathe on card 1 bloom — runs through Card 2 + 3 hold
        const breathe1 = { p: 0 };
        tl.to(
          breathe1,
          {
            p: Math.PI * 2 * 3.5,
            duration: 15.6,
            ease: "none",
            onUpdate: () => {
              const s = Math.sin(breathe1.p);
              const el = document.getElementById("bloom1");
              if (el) {
                el.style.opacity = String(0.65 + s * 0.08);
              }
            },
          },
          7.0,
        );

        // ───────────── Phase 3: CARD 2 — NEWS SENTIMENT (9.0 – 15.5s) ─────────────

        tl.fromTo(
          "#card2",
          { opacity: 0, x: 80, scale: 0.985 },
          { opacity: 1, x: 0, scale: 1, duration: 0.7, ease: "power3.out" },
          9.1,

        tl.fromTo(
          "#bloom2",
          { opacity: 0, scale: 0.92 },
          { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" },
          9.3,
        );
        tl.to("#ghost2", { opacity: 0, duration: 0.4, ease: "power2.out" }, 9.4);

        // Endpoint row 1 (cyan path)
        tl.fromTo(
          "#ep1",
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          9.9,
        );
        // Endpoint row 2 (muted path)
        tl.fromTo(
          "#ep2",
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          10.6,

            el,
            { opacity: 0, y: 8, scale: 0.96 },
            { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
            12.2 + i * 0.25,
          );
        });

        // Bounded breathe on card 2
        const breathe2 = { p: 0 };
        tl.to(
          breathe2,
          {
            p: Math.PI * 2 * 2.6,
            duration: 9.5,
            ease: "none",
            onUpdate: () => {
              const s = Math.sin(breathe2.p);
              const el = document.getElementById("bloom2");
              if (el) {
                el.style.opacity = String(0.62 + s * 0.08);
              }
            },
          },
          13.0,
        );

        // ───────────── Phase 4: CARD 3 — MACRO PAUSE (15.5 – 22.0s) ─────────────

        tl.fromTo(
          "#card3",
          { opacity: 0, x: 80, scale: 0.985 },
          { opacity: 1, x: 0, scale: 1, duration: 0.7, ease: "power3.out" },
          15.6,
        );
        tl.fromTo(
          "#bloom3",
          { opacity: 0, scale: 0.92 },
          { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" },
          15.8,
        );
        tl.to("#ghost3", { opacity: 0, duration: 0.4, ease: "power2.out" }, 15.9);

        // Calendar cells stagger in
        const calCells = document.querySelectorAll("#cal-row .cal-cell");
        calCells.forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
            16.4 + i * 0.18,
          );
        });

        // Rule chips: < 4h: SKIP ENTRIES (lands first, then pulses)
        const ruleChips = document.querySelectorAll("#rule-chips .rule-chip");
        ruleChips.forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0, y: 8, scale: 0.96 },
            { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
            17.6 + i * 0.4,
          );
        });

        // Amber pulse on "SKIP ENTRIES" chip — single bloom-and-settle (no yoyo)
        tl.fromTo(
          "#rule-chips .rule-chip.pulse",
          { boxShadow: "0 0 0px rgba(217,119,6,0.0)" },
          {
            boxShadow: "0 0 28px rgba(217,119,6,0.55)",
            duration: 0.5,
            ease: "power2.out",
          },
          18.3,
        );
        tl.to(
          "#rule-chips .rule-chip.pulse",
          {
            boxShadow: "0 0 14px rgba(217,119,6,0.22)",
            duration: 0.7,
            ease: "power2.inOut",
          },
          18.8,
        );

        // Amber bloom breathe on card 3 — bounded breathe through the hold
        const breathe3 = { p: 0 };
        tl.to(
          breathe3,
          {
            p: Math.PI * 2 * 1.6,
            duration: 6.2,
            ease: "none",
            onUpdate: () => {
              const s = Math.sin(breathe3.p);
              const el = document.getElementById("bloom3");
              if (el) {
                el.style.opacity = String(0.72 + s * 0.10);
              }
            },
          },
          16.5,
        );

        // ───────────── Phase 5: held read (22.0 – 22.756s) ─────────────

        // A tiny sub-pixel composition settle: drift the heading-rule a hair to
        // keep the held read alive without crossing the keep-out.
        tl.to("#head-rule", { width: 168, duration: 0.6, ease: "power2.inOut" }, 22.0);

        // Final tail: hold motionless. Caret keeps blinking via the long sin
        // tween from Phase 1.

        window.__timelines["03-sosovalue"] = tl;
      })();
    </script>
  </div>
</template>
