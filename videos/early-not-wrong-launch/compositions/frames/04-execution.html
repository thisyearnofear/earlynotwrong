    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        // Station X centers (in pipe SVG viewBox coordinates, viewBox = 0..1720 wide)
        // SVG width = 1728px, viewBox width = 1720 → ~1:1
        var STATION_X = [110, 470, 830, 1190, 1550];

        // --- Terminal line discrete sequences (driven via onUpdate) ---
        var LINE_1_FULL = "[7/8] Executing 1 entry via SoDEX -> TWAK fallback...";
        var LINE_2_PREFIX = "[OK] Trade executed - ";
        var LINE_2_HASH = "0xc810ed3f2adcc3b2...";
        var LINE_2_SUFFIX = "";

        var line1El = document.getElementById("line-1-text");
        var line2El = document.getElementById("line-2-text");
        var caretEl = document.getElementById("term-caret");

        // Helper — render line-2 with hash colored cyan
        function setLine2(chars) {
          // chars counts characters typed total across prefix+hash+suffix
          var prefixLen = LINE_2_PREFIX.length;
          var hashLen = LINE_2_HASH.length;
          if (chars <= 0) {
            line2El.innerHTML = "";
            return;
          }
          if (chars <= prefixLen) {
            line2El.textContent = LINE_2_PREFIX.substring(0, chars);
            return;
          }
          var hashChars = Math.min(chars - prefixLen, hashLen);
          var hashStr = LINE_2_HASH.substring(0, hashChars);
          line2El.innerHTML =
            '<span style="color:#ededed">' +
            LINE_2_PREFIX +
            "</span>" +
            '<span style="color:#22d3ee">' +
            hashStr +
            "</span>";
        }

        var tl = gsap.timeline({ paused: true });

        // ===============================================================
        // SCENE 1 (0.0–2.0s): pipe stations dim, terminal outline present
        // ===============================================================

        // Eyebrow fades in immediately
        tl.fromTo(
          "#eyebrow",
          { opacity: 0, y: -6 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
          0.1,
        );

        // Terminal frame fades in
        tl.fromTo(
          "#terminal",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
          0.3,
        );

        // Pipe stations + connectors arrive (dim baseline)
        tl.fromTo(
          "#pipe-wrap",
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
          0.2,
        );

        // ===============================================================
        // SCENE 2 (2.0–4.5s): dot traverses 5 stations on VO "Signals drive trades"
        // ===============================================================

        // Dot ignites at SOSOVALUE
        tl.fromTo(
          "#travel-dot",
          { opacity: 0, attr: { cx: STATION_X[0], r: 12 } },
          { opacity: 1, attr: { r: 9 }, duration: 0.25, ease: "power2.out" },
          2.0,
        );

        // Per-station traversal — each segment 0.42s — fade station to full white as dot arrives
        var SEG_DUR = 0.42;
        var dotStarts = [2.0, 2.25, 2.75, 3.25, 3.75]; // when dot is AT station i
        // Animate cx through station positions sequentially
        tl.to(
          "#travel-dot",
          { attr: { cx: STATION_X[1] }, duration: SEG_DUR, ease: "power2.inOut" },
          2.25,
        );
        tl.to(
          "#travel-dot",
          { attr: { cx: STATION_X[2] }, duration: SEG_DUR, ease: "power2.inOut" },
          2.75,
        );
        tl.to(
          "#travel-dot",
          { attr: { cx: STATION_X[3] }, duration: SEG_DUR, ease: "power2.inOut" },
          3.25,
        );
        tl.to(
          "#travel-dot",
          { attr: { cx: STATION_X[4] }, duration: SEG_DUR, ease: "power2.inOut" },
          3.75,
        );

        // Station chips light to full white as dot lands
        var stationChips = [
          "#station-1 .station-chip",
          "#station-2 .station-chip",
          "#station-3 .station-chip",
          "#station-4 .station-chip",
          "#station-5 .station-chip",
        ];
        var stationSubs = [
          "#station-1 .station-sub",
          "#station-2 .station-sub",
          "#station-3 .station-sub",
          "#station-4 .station-sub",
          "#station-5 .station-sub",
        ];
        for (var i = 0; i < 5; i++) {
          tl.to(
            stationChips[i],
            {
              opacity: 1,
              borderColor: "rgba(34,211,238,0.55)",
              backgroundColor: "rgba(34,211,238,0.08)",
              duration: 0.35,
              ease: "power2.out",
            },
            dotStarts[i],
          );
          tl.to(
            stationSubs[i],
            { opacity: 1, duration: 0.35, ease: "power2.out" },
            dotStarts[i] + 0.05,
          );
        }

        // Connectors brighten as dot passes
        var connectors = ["#conn-1", "#conn-2", "#conn-3", "#conn-4"];
        for (var c = 0; c < 4; c++) {
          tl.to(
            connectors[c],
            { stroke: "#22d3ee", duration: 0.35, ease: "power2.out" },
            2.25 + c * 0.5,
          );
        }

        // Dot fades out at end of traversal
        tl.to("#travel-dot", { opacity: 0, duration: 0.35, ease: "power1.out" }, 4.2);

        // ===============================================================
        // SCENE 3 (4.5–7.848s): SoDEX preferred ring, fallback arrow, terminal types
        // ===============================================================

        // PREFERRED ring around SODEX (station 4)
        tl.fromTo(
          "#preferred-ring",
          { opacity: 0, attr: { r: 64 } },
          { opacity: 0.7, attr: { r: 78 }, duration: 0.55, ease: "power2.out" },
          4.5,
        );
        tl.fromTo(
          "#station-4 .preferred-label",
          { opacity: 0, y: 4 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          4.65,
        );

        // Fallback arrow drops in
        tl.fromTo(
          "#fallback-arrow",
          { opacity: 0, y: -8 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
          4.8,
        );

        // ----- Terminal typing: line 1 (continuous slice) -----
        var line1Driver = { v: 0 };
        tl.to(
          line1Driver,
          {
            v: LINE_1_FULL.length,
            duration: 1.3,
            ease: "none",
            onUpdate: function () {
              line1El.textContent = LINE_1_FULL.substring(0, Math.floor(line1Driver.v));
            },
          },
          4.7,
        );

        // ----- Terminal typing: line 2 (with hash in cyan) -----
        var line2TotalChars = LINE_2_PREFIX.length + LINE_2_HASH.length;
        var line2Driver = { v: 0 };
        tl.to(
          line2Driver,
          {
            v: line2TotalChars,
            duration: 1.4,
            ease: "none",
            onUpdate: function () {
              setLine2(Math.floor(line2Driver.v));
            },
          },
          6.15,
        );

        // Green checkmark lands at end of line 2
        tl.fromTo(
          "#term-check",
          { opacity: 0, scale: 0.6 },
          { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" },
          7.5,
        );

        // ----- Caret blink (deterministic via sin driver) -----
        var blinkDriver = { p: 0 };
        tl.to(
          blinkDriver,
          {
            p: Math.PI * 2 * 11, // ~11 blink cycles across 7.848s -> ~0.71s/cycle
            duration: 7.848,
            ease: "none",
            onUpdate: function () {
              caretEl.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0";
            },
          },
          0,
        );

        window.__timelines["04-execution"] = tl;
      })();
