    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // ----- Element handles -----
        var bgImg = document.getElementById("02-thesis-bg");
        var eyebrow = document.getElementById("02-thesis-eyebrow");
        var lineMain = document.querySelector("#root .line-main");
        var tok1Predict = document.getElementById("02-thesis-tok1-predict");
        var tok1Score = document.getElementById("02-thesis-tok1-score");
        var tok2Prices = document.getElementById("02-thesis-tok2-prices");
        var tok2Conviction = document.getElementById("02-thesis-tok2-conviction");
        var strike = document.getElementById("02-thesis-strike");
        var echo = document.getElementById("02-thesis-echo");
        var tickNews = document.getElementById("02-thesis-tick-news");
        var rows = [
          document.getElementById("02-thesis-row-1"),
          document.getElementById("02-thesis-row-2"),
          document.getElementById("02-thesis-row-3"),
          document.getElementById("02-thesis-row-4"),
          document.getElementById("02-thesis-row-5"),
          document.getElementById("02-thesis-row-6"),
        ];

        // ============================================================
        // Scene 1 (0.0 – 1.6s) — "MOST TRADING AGENTS / PREDICT PRICES."
        // VO: "Most trading agents predict prices."
        // ============================================================

        // Background fades in subtly behind everything.
        tl.fromTo(
          bgImg,
          { opacity: 0 },
          { opacity: 0.3, duration: 0.6, ease: "power2.out" },
          0
        );

        // Eyebrow lands first.
        tl.fromTo(
          eyebrow,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.1
        );

        // Main line "PREDICT PRICES." rises into place.
        tl.fromTo(
          lineMain,
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          0.45
        );

        // ============================================================
        // Scene 2 (1.6 – 3.4s) — strike + in-place token swap
        // VO: "Early, Not Wrong scores conviction —"
        // ============================================================

        // Cyan strikethrough draws left-to-right across the headline.
        tl.fromTo(
          strike,
          { scaleX: 0, opacity: 1 },
          { scaleX: 1, duration: 0.55, ease: "power3.inOut" },
          1.7
        );

        // Hard-cut token swaps on the spoken words.
        // Each pair: base out (instant), replacement in (instant) — discrete.
        // PREDICT -> SCORE lands on "scores"
        tl.to(tok1Predict, { opacity: 0, duration: 0.001 }, 2.55);
        tl.to(tok1Score, { opacity: 1, duration: 0.001 }, 2.55);

        // PRICES -> CONVICTION lands on "conviction"
        tl.to(tok2Prices, { opacity: 0, duration: 0.001 }, 2.95);
        tl.to(tok2Conviction, { opacity: 1, duration: 0.001 }, 2.95);

        // Tiny settle pulse on the new line after the swap.
        tl.fromTo(
          tok2Conviction,
          { scale: 1.0 },
          { scale: 1.0, duration: 0.001 },
          2.95
        );

        // After the swap, fade the strike out to leave the affirmative line clean.
        tl.to(
          strike,
          { opacity: 0, duration: 0.4, ease: "power2.out" },
          3.05
        );

        // ============================================================
        // Scene 3 (3.4 – 6.0s) — affirmative read; old claim echoes below
        // VO: "— the willingness to hold quality assets through fear."
        // ============================================================

        tl.fromTo(
          echo,
          { opacity: 0, y: 6 },
          { opacity: 0.7, y: 0, duration: 0.55, ease: "power2.out" },
          3.5
        );

        // ============================================================
        // Scene 4 (6.0 – 9.427s) — six-row breakdown reveals to the VO tail.
        // Stagger 0.4s; final NEWS tick glows on land. Held-read final.
        // ============================================================

        var rowStart = 6.0;
        var stagger = 0.4;
        for (var i = 0; i < rows.length; i++) {
          tl.fromTo(
            rows[i],
            { opacity: 0, x: 18 },
            { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
            rowStart + i * stagger
          );
        }

        // NEWS tick glow as it lands (last row at 6.0 + 5*0.4 = 8.0s).
        var newsAt = rowStart + (rows.length - 1) * stagger; // 8.0s
        tl.fromTo(
          tickNews,
          {
            boxShadow: "0 0 0px rgba(34,211,238,0)",
            scale: 1,
          },
          {
            boxShadow: "0 0 24px rgba(34,211,238,0.85)",
            scale: 1.08,
            duration: 0.35,
            ease: "power2.out",
          },
          newsAt + 0.15
        );
        tl.to(
          tickNews,
          {
            boxShadow: "0 0 10px rgba(34,211,238,0.45)",
            scale: 1.0,
            duration: 0.6,
            ease: "power2.inOut",
          },
          newsAt + 0.5
        );

        // Held read to the end (no exit — non-final frame).
        window.__timelines["02-thesis"] = tl;
      })();
