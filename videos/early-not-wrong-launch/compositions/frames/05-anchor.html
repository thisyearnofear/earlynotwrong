        tl.to("#hashBridge", { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.9);

        const hashPath = document.getElementById("hashBridgePath");
        const hashLen = hashPath.getTotalLength();
        hashPath.style.strokeDasharray = String(hashLen);
        hashPath.style.strokeDashoffset = String(hashLen);

        tl.to(
          hashPath,
          { strokeDashoffset: 0, duration: 1.3, ease: "power2.out" },
          3.0
        );

        // Hash text fades in as the line lands
        tl.fromTo(
          "#hashBridgeText",
          { opacity: 0, y: 6 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
          3.9
        );

        // Single soft glow beat on the bridge line (no repeat — finite tween)
        tl.fromTo(
          hashPath,
          { strokeWidth: 1.5 },
          { strokeWidth: 2.4, duration: 0.35, ease: "power2.out" },
          4.5
        );
        tl.to(hashPath, { strokeWidth: 1.5, duration: 0.6, ease: "power2.inOut" }, 4.85);

        // --- Scene 3 (5.5–8.731s): camera pulls back, hub graph reveals ---
        // Camera pull-back: 1.0 → 0.7 over ~1.5s
        tl.to(
          "#camera",
          { scale: 0.7, duration: 1.5, ease: "power3.inOut" },
          5.5
        );

        // Background grid faintly establishes the wider canvas during pull-back
        tl.to("#bgGrid", { opacity: 0.35, duration: 1.2, ease: "power1.out" }, 5.6);

        // Hub graph container fade in (the lines + center + satellites live here)
        tl.to("#hubGraph", { opacity: 1, duration: 0.6, ease: "power1.out" }, 6.0);

        // Center ENW AGENT node pops

          "#hubCenter",
          { opacity: 0, scale: 0.6 },
          { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
          6.2
        );

        // Anchor connectors draw out from center to the two chain cards (faint)
        const anchorLines = [
          { id: "#lineMantleAnchor", at: 6.4 },
          { id: "#lineCasperAnchor", at: 6.45 },
        ];
        anchorLines.forEach((l) => {
          const node = document.querySelector(l.id);
          const len = Math.hypot(
            Number(node.getAttribute("x2")) - Number(node.getAttribute("x1")),
            Number(node.getAttribute("y2")) - Number(node.getAttribute("y1"))
          );
          node.style.strokeDasharray = String(len);
          node.style.strokeDashoffset = String(len);
          node.style.opacity = "0.25";
          tl.to(node, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, l.at);

        // Satellite connectors draw out from center
        const satLines = [
          { id: "#lineYield", at: 6.6 },
          { id: "#lineWallet", at: 6.75 },
          { id: "#lineOracle", at: 6.9 },

            Number(node.getAttribute("x2")) - Number(node.getAttribute("x1")),
            Number(node.getAttribute("y2")) - Number(node.getAttribute("y1"))

          node.style.strokeDashoffset = String(len);
