[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conviction-gym"
version = "0.1.0"
description = "RL environment for conviction-based crypto trading — replays real market episodes, LLM-agent ready (Reflection Beam)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.20"]

[tool.setuptools.packages.find]
include = ["conviction_gym*"]
